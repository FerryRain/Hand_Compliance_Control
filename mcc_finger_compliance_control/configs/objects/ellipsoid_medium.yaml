id: ellipsoid_medium
display_name: Ellipsoid
family: smooth_convex
rgba: [0.45, 0.72, 0.30, 1.00]

geoms:
  - type: ellipsoid
    size: [0.15, 0.115, 0.10]

motion:
  translation:
    allowed_axes: [principal_x, principal_y, principal_z]
    distance_mode: object_extent_ratio
    distance_ratio_range: [0.15, 0.45]
    absolute_max_m: 0.055
  rotation:
    allowed_axes: [principal_x, principal_y, principal_z, uniform_sphere]
    angle_range_deg: [60.0, 300.0]

